<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Defs for gradients, patterns, and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Orange-Amber Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />  <!-- Orange 500 -->
      <stop offset="50%" stop-color="#EA580C" /> <!-- Orange 600 -->
      <stop offset="100%" stop-color="#F59E0B" /> <!-- Amber 500 -->
    </linearGradient>

    <!-- Soft Glow Gradient for Nodes -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="1" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1F2937" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="24" cy="0" r="1.2" fill="#374151" fill-opacity="0.2" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="512" height="512" rx="44" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="43" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Grid Overlay -->
  <rect width="512" height="512" rx="44" fill="url(#grid)" />

  <!-- Decorative Abstract Tech Waves in Background -->
  <path d="M 380,512 C 430,450 460,470 512,420 L 512,512 Z" fill="#F97316" fill-opacity="0.02" />
  <path d="M 0,180 C 100,160 150,230 250,200" fill="none" stroke="#F97316" stroke-width="1" stroke-opacity="0.04" />
  <path d="M 262,40 C 350,70 380,30 480,80" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.03" />

  <!-- LOGO MARK (ICON) - Scaled and Centered -->
  <g transform="translate(256, 205) scale(1.35) translate(-160, -145)" filter="url(#shadowFilter)">
    <!-- Ambient Glow behind the pot -->
    <circle cx="160" cy="165" r="70" fill="url(#glowGrad)" opacity="0.15" filter="url(#glowFilter)" />

    <!-- Technical System Rings (Outer Orbit / Inventory Flow) -->
    <!-- Front loop of the orbit -->
    <path d="M 70,175 C 65,185 80,205 130,212 C 180,219 240,210 255,190" 
          fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 65,170 C 60,180 75,200 125,207" 
          fill="none" stroke="url(#brandGrad)" stroke-width="1" stroke-dasharray="4 6" opacity="0.7" />

    <!-- Connected Tech Nodes / Steam -->
    <!-- Left Steam Node -->
    <path d="M 135,120 C 120,95 140,75 125,50" 
          fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="125" cy="50" r="8" fill="#111827" stroke="#F97316" stroke-width="3" />
    <circle cx="125" cy="50" r="3" fill="#F59E0B" />

    <!-- Center Steam Node -->
    <path d="M 160,120 C 160,90 170,75 165,40" 
          fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="165" cy="40" r="10" fill="#111827" stroke="#EA580C" stroke-width="3" />
    <circle cx="165" cy="40" r="4" fill="#F97316" />

    <!-- Right Steam Node -->
    <path d="M 185,120 C 200,98 185,80 200,55" 
          fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="200" cy="55" r="8" fill="#111827" stroke="#F59E0B" stroke-width="3" />
    <circle cx="200" cy="55" r="3" fill="#F97316" />

    <!-- Node-to-Node Connection lines (Data flow) -->
    <path d="M 125,50 C 145,35 150,45 165,40" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <path d="M 165,40 C 180,45 185,45 200,55" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Traditional Bengali Clay Pot (Handi) -->
    <!-- Back lip / inside of the pot -->
    <ellipse cx="160" cy="125" rx="35" ry="6" fill="#1F2937" stroke="#4B5563" stroke-width="1.5" />

    <!-- Pot Handles (Bengali Handi Ears) -->
    <path d="M 120,135 C 105,135 105,155 122,157" fill="none" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 200,135 C 215,135 215,155 198,157" fill="none" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Pot Body -->
    <path d="M 124,128 
             C 120,165 110,195 160,195 
             C 210,195 200,165 196,128
             C 185,132 175,133 160,133
             C 145,133 135,132 124,128 Z" 
          fill="url(#brandGrad)" />

    <!-- Pot Highlights/Shadows for 3D realism -->
    <path d="M 130,136 C 130,165 130,185 160,185 C 190,185 190,165 190,136" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.2" />

    <!-- Lid resting dynamically on the side or hovering (indicating cooking & activity) -->
    <g transform="translate(10, -5) rotate(-8, 160, 120)">
      <!-- Lid Handle -->
      <path d="M 152,118 C 152,110 168,110 168,118" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" />
      <!-- Lid Body -->
      <ellipse cx="160" cy="119" rx="36" ry="6" fill="#374151" stroke="url(#brandGrad)" stroke-width="2" />
      <ellipse cx="160" cy="119" rx="24" ry="4" fill="url(#brandGrad)" opacity="0.8" />
    </g>

    <!-- Orbit ring segment passing in front of the pot for 3D depth -->
    <path d="M 85,182 C 115,198 175,202 215,190" 
          fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    
    <!-- Data pulse on the orbit ring -->
    <circle cx="150" cy="198" r="4" fill="#FFFFFF" filter="url(#glowFilter)" />
    <circle cx="150" cy="198" r="2" fill="#F97316" />
  </g>

  <!-- TYPOGRAPHY SECTION (STACKED) -->
  <!-- Main Title: DeshiKitchen -->
  <text x="256" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Deshi<tspan fill="url(#brandGrad)">Kitchen</tspan>
  </text>

  <!-- Subtitle: Inventory Management System -->
  <text x="256" y="414" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="4.5">
    INVENTORY MANAGEMENT SYSTEM
  </text>

  <!-- Status Indicator -->
  <g transform="translate(176, 442)">
    <!-- Pulsing Active Green Dot -->
    <circle cx="6" cy="-4" r="3.5" fill="#10B981" />
    <circle cx="6" cy="-4" r="7" fill="#10B981" opacity="0.3" />
    <text x="20" y="0" font-family="Courier New, Courier, monospace" font-size="10" font-weight="bold" fill="#64748B" letter-spacing="0.5">
      SYS.ACTIVE // MULTI-ROLE
    </text>
  </g>
</svg>
